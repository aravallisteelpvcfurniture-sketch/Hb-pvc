name: Build Installable Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug Installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare Debug APK Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Aravalli-Furniture-debug.apk

      - name: Upload Installable APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aravalli-Furniture-APK
          path: artifacts/Aravalli-Furniture-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on version tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        permissions:
          contents: write
        with:
          files: artifacts/Aravalli-Furniture-debug.apk
